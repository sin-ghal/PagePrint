services:
  server:
    build:
      context: ./server
    container_name: pageprint-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # MONGODBURL comes from ./server/.env (MongoDB Atlas)
      FRONTEND_URL: http://localhost:3000
      PORT: 4000
    ports:
      - "4000:4000"
    networks:
      - pageprint-net

  client:
    build:
      context: ./client
      args:
        # NEXT_PUBLIC_* is baked at build time. Browser calls the host-exposed
        # server port, so localhost is correct here.
        NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
    container_name: pageprint-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:3000"
    environment:
      # Server-side (SSR) fetches run inside this container, where "localhost"
      # means the container itself. Use the Docker service name so SSR can reach
      # the backend over the bridge network. Browser fetches still use the
      # host-exposed localhost:4000 via NEXT_PUBLIC_BACKEND_URL (build-time).
      BACKEND_INTERNAL_URL: http://server:4000
    networks:
      - pageprint-net

networks:
  pageprint-net:
    driver: bridge
